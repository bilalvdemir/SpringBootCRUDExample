global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'user-crud-monitor'

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8090']
        labels:
          application: 'user-crud-api'
          environment: 'docker'
